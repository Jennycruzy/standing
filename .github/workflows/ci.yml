name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: acp-adapter/package-lock.json
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . mypy
      - name: Test Python
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Type-check Python
        run: python -m mypy --strict standing
      - name: Install verifier adapter
        run: npm ci --prefix acp-adapter
      - name: Test verifier adapter
        run: npm --prefix acp-adapter test
      - name: Type-check verifier adapter
        run: npm --prefix acp-adapter run typecheck
