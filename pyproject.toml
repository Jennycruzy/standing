[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standing"
version = "0.1.0"
description = "A memory-backed reviewer for decisions and changing conditions"
requires-python = ">=3.12,<3.13"
dependencies = ["sibyl-memory-client==0.8.0"]

[tool.setuptools.packages.find]
include = ["standing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
