[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standing"
version = "0.1.0"
description = "A memory-backed reviewer for decisions and changing conditions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2024.8.30",
    "sibyl-memory-client==0.8.0",
    "eth-abi==6.0.0",
    "eth-utils==5.3.1",
]

[project.scripts]
standing = "standing.cli:main"

[tool.setuptools.packages.find]
include = ["standing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
