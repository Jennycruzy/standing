services:
  - type: web
    name: standing
    runtime: python
    plan: free
    buildCommand: python -m pip install '.[dev]' && python -m pytest -q && python -m mypy --strict standing
    startCommand: standing dashboard --sandbox --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PYTHONUNBUFFERED
        value: "1"
